# 8.3.45 up 12-07 01:41, down 10:08; 8.3.46 up 12-07 02:27, down 10:09.
# start rounded down and end rounded up to whole days.
window: {start: 2024-12-04T00:00:00Z, end: 2024-12-07T23:59:59Z}
pypi:
