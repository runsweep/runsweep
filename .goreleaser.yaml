version: 2
project_name: runsweep
builds:
  - main: ./cmd/runsweep
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}"]
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    format_overrides: [{goos: windows, formats: [zip]}]
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
changelog:
  use: github-native
homebrew_casks:
  - name: runsweep
    description: Which CI runs did a supply-chain incident touch, and which secrets to rotate first
    homepage: https://github.com/runsweep/runsweep
    commit_author: {name: runsweep-release, email: noreply@github.com}
    repository:
      owner: runsweep
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:runsweep/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # the binary is not notarized; the cask checks its sha256 instead
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/runsweep"]
          end
